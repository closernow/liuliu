<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>溜溜</title>
<meta name="description" content="一年级上册语文混音游戏：拖字宝宝到溜溜身上，听它们唱歌。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1d1633">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="tbtn" id="mapBtn" aria-label="阶段地图">🗺️ 地图</button>
    <div class="badge" id="badge" title="家长：长按 2 秒进入家长入口"></div>
    <div class="eggs" id="eggs"></div>
    <button class="tbtn rec" id="recBtn" hidden>🎤 录音室</button>
    <button class="evo" id="evoBtn" disabled>✨ 进化</button>
    <button class="tbtn write" id="writeBtn">✍️ 写字</button>
    <button class="tbtn" id="songBtn">⏺ 录歌</button>
    <button class="tbtn" id="mySongsBtn">🎵 我的歌</button>
    <button class="tbtn" id="clearBtn" aria-label="清空舞台">🧹</button>
  </header>
  <main class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="lyrics" id="lyrics" hidden></div>
    <div class="row" id="row"></div>
  </main>
  <nav class="bar" id="bar"></nav>
</div>

<div class="overlay" id="mapLayer" hidden>
  <div class="mapbox">
    <div class="maphead"><b>阶段地图</b><button class="tbtn" id="mapClose">✕ 关闭</button></div>
    <div class="tiles" id="tiles"></div>
  </div>
</div>
<div class="overlay" id="songsLayer" hidden><div class="mapbox"><div class="maphead"><b>🎵 我的歌</b><button class="tbtn" id="songsClose">✕ 关闭</button></div><div id="songList"></div></div></div>
<div class="overlay" id="parentLayer" hidden><div class="mapbox"><div class="maphead"><b>家长入口</b><button class="tbtn" id="parentClose">✕ 关闭</button></div><div id="parentBody"></div></div></div>
<div class="unlockfx" id="unlockFx" hidden><div class="rays"></div><div class="ufglow"></div><div class="uftitle" id="ufTitle"></div><div class="ufcard" id="ufCard"></div><div class="ufhint">点一下继续</div></div>
<div class="overlay" id="galLayer" hidden><div class="mapbox"><div class="maphead"><b>👥 伙伴图鉴</b><button class="tbtn" id="galClose">✕ 关闭</button></div><div id="galBody"></div></div></div>
<div class="overlay" id="writeLayer" hidden><div class="mapbox wbox2"><div class="maphead"><b>✍️ 写字</b><span><button class="tbtn" id="wBack" hidden>◀ 字表</button> <button class="tbtn" id="wClose">✕ 关闭</button></span></div><div id="wBody"></div></div></div>
<div class="banner" id="banner" hidden><div class="bw" id="bw"></div><div class="bp" id="bp"></div></div>
<div class="warp" id="warp" aria-hidden="true"><div class="stars"></div><div class="ring"></div><div class="wt" id="wt">进化中</div><div class="ws" id="ws"></div></div>
<div class="toast" id="toast"></div>
<div class="overlay start" id="startLayer">
  <button class="startbtn" id="startBtn">▶ 开始</button>
  <div class="hint">溜溜 · 一年级上册语文</div>
</div>

<script src="js/vendor/hanzi-writer.min.js"></script>
<script type="module" src="js/main.js"></script>
<script>
// 离线用：只在网上版本注册（本地预览时改代码要马上看到效果，不缓存）
if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
