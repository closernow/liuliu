<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学闯关 · 溜溜数学</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/math.css">
</head>
<body>
<div class="top">
  <button class="home" onclick="location.href='map.html'">🗺️ 地图</button>
  <h1 id="stTitle"></h1>
  <span class="pill" id="stPage"></span>
  <div class="dots" id="dots"></div>
  <button class="replay" id="replay" title="再听一遍">🔊</button>
</div>
<div class="stage"><div class="act" id="act"></div></div>
<div class="overlay" id="startLayer"><div class="panel"><h2 id="startTitle"></h2><div class="sub" id="startSub"></div><button class="btn" id="goBtn">开始 ▶</button></div></div>
<div class="overlay" id="doneLayer" hidden><div class="panel"><h2>🎉 过关啦！</h2><div class="bigstars" id="doneStars"></div><p id="doneTxt"></p>
  <button class="btn" id="nextBtn">下一关 ▶</button> <button class="btn ghost" id="againBtn">再玩一次</button> <button class="btn ghost" onclick="location.href='map.html'">回地图</button></div></div>
<script type="module" src="../js/math/stage.js"></script>
</body>
</html>
